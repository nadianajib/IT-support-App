<div class="container">
    <h2>{{ isNew ? 'Ajouter une Panne' : 'Modifier la Panne' }}</h2>
    <form (ngSubmit)="savePanne()" #panneForm="ngForm">
      <div class="form-group">
        <label for="description">Description</label>
        <input
          type="text"
          id="description"
          class="form-control"
          [(ngModel)]="panne.description"
          name="description"
          required
          #description="ngModel"
        />
        <div *ngIf="description.invalid && (description.dirty || description.touched)" class="text-danger">
          La description est requise.
        </div>
      </div>
  
      <div class="form-group">
        <label for="etatPanne">État</label>
        <select
          id="etatPanne"
          class="form-control"
          [(ngModel)]="panne.etatPanne"
          name="etatPanne"
          required
        >
          <option value="SIGNALEE">Signalée</option>
          <option value="EN_COURS">En cours</option>
          <option value="RESOLUE">Résolue</option>
          <option value="NON_REPARABLE">Non réparable</option>
        </select>
        <div *ngIf="panneForm.submitted && panneForm.controls['etatPanne'].invalid" class="text-danger">
          L'état de la panne est requis.
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary">{{ isNew ? 'Ajouter' : 'Mettre à jour' }}</button>
      <a [routerLink]="['/pannes']" class="btn btn-secondary ml-2">Annuler</a>
  
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </form>
  </div>
