<!-- panne-list.component.html -->
<div class="container">
  <h2>Liste des Pannes</h2>
  <div class="mb-3">
    <a [routerLink]="['/pannes/add']" class="btn btn-primary">Ajouter une panne</a>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Description</th>
        <th>État</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let panne of pannes">
        <td>{{ panne.idPanne }}</td>
        <td>{{ panne.description }}</td>
        <td>{{ panne.etatPanne }}</td>
        <td>
          <button (click)="onEdit(panne.idPanne)" class="btn btn-warning btn-sm">Éditer</button>
          <button (click)="onDelete(panne.idPanne)" class="btn btn-danger btn-sm">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
